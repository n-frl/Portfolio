<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nabil Elkorchi — Civil &amp; Environmental Engineering</title>
    <meta
      name="description"
      content="Portfolio of Nabil Elkorchi, civil and environmental engineering student at UMass Amherst focused on structures."
    />
    <meta name="author" content="Nabil Elkorchi" />

    <!-- OpenGraph / partage sur les reseaux -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Nabil Elkorchi" />
    <meta property="og:title" content="Nabil Elkorchi — Civil &amp; Environmental Engineering" />
    <meta
      property="og:description"
      content="Civil and environmental engineering student at UMass Amherst, focused on structures."
    />
    <meta name="twitter:card" content="summary" />

    <!-- Couleur de la barre d'adresse mobile, alignee sur le theme actif -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090e13" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <script>
      // ----------------------------------------------------------------------
      // 1) Anti-flash : applique le theme sombre AVANT le premier rendu, pour
      //    eviter l'eclair blanc au chargement.
      // ----------------------------------------------------------------------
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage indisponible : on reste en clair */
        }
      })();

      // ----------------------------------------------------------------------
      // 2) Restauration de route SPA (voir public/404.html).
      //    GitHub Pages ne connait pas les routes cote client : /experience
      //    renvoie un 404. Le fichier 404.html encode l'URL demandee dans la
      //    query string, et ce script la restaure ici via history.replaceState.
      //    Technique de rafgraph/spa-github-pages. Aucun backend requis.
      // ----------------------------------------------------------------------
      (function () {
        var search = window.location.search;
        if (search.charAt(1) !== '/') return;
        var decoded = search
          .slice(1)
          .split('&')
          .map(function (part) {
            return part.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(
          null,
          '',
          window.location.pathname.slice(0, -1) + decoded + window.location.hash
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This portfolio requires JavaScript. The resume PDF is available at
      <a href="./resume/Nabil-Elkorchi-Resume.pdf">resume/Nabil-Elkorchi-Resume.pdf</a>.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
